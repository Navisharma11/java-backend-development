<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="ISO-8859-1">
    <title>Ticket Information</title>
</head>

<body>

<h1>Find the detailed Ticket Below</h1>

<table>

    <tr>
        <td>Ticket Number:</td>
        <td>
            <p th:text="${ticket.ticketNumber}"></p>
        </td>
    </tr>

    <tr>
        <td>Passenger Name:</td>
        <td>
            <p th:text="${ticket.name}"></p>
        </td>
    </tr>

    <tr>
        <td>Departure:</td>
        <td>
            <p th:text="${ticket.departure}"></p>
        </td>
    </tr>

    <tr>
        <td>Arrival At:</td>
        <td>
            <p th:text="${ticket.arrival}"></p>
        </td>
    </tr>

    <tr>
        <td>Date Of Journey:</td>
        <td>
            <p th:text="${ticket.dateOfJourney}"></p>
        </td>
    </tr>

    <tr>
        <td>Ticket status:</td>
        <td>
            <p th:text="${ticket.status}"></p>
        </td>
    </tr>

</table>

</body>

</html>
